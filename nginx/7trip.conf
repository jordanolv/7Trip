server {
    if ($host = www.7trip.co) {
        return 301 https://$host$request_uri;
    }

    if ($host = 7trip.co) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name 7trip.co www.7trip.co;
    return 404;
}

server {
    if ($host = dev.7trip.co) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name dev.7trip.co;
    return 404;
}

server {
    if ($host = api.dev.7trip.co) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name api.dev.7trip.co;
    return 404;
}
