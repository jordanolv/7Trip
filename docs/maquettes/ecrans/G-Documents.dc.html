<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>7Trip — Documents</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F3EC; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1B2433">
  <div style="padding: 50px 16px 0; display: flex; align-items: center; gap: 8px">
    <a href="G-Plus.dc.html" aria-label="Retour" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B2433" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a>
    <h1 style="flex: 1; margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em">Documents</h1>
    <button aria-label="Rechercher" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: transparent; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B2433" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
    <button aria-label="Ajouter un document" style="width: 48px; height: 48px; border-radius: 16px; border: none; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>

  <div style="padding: 14px 0 0 16px; display: flex; gap: 8px; overflow: hidden">
    <sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
      <button onClick="{{f.pick}}" style="flex: 0 0 auto; height: 36px; padding: 0 13px; border-radius: 999px; border: none; font-family: inherit; font-size: 13px; font-weight: 600; background: {{f.bg}}; color: {{f.fg}}">{{f.label}}</button>
    </sc-for>
  </div>

  <div style="padding: 14px 16px 0; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <div style="font-size: 13px; font-weight: 700; color: #5E6675; margin-top: 4px">{{g.label}}</div>
      <div style="background: #FFFFFF; border-radius: 20px; display: flex; flex-direction: column">
        <sc-for list="{{g.docs}}" as="d" hint-placeholder-count="2">
          <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: {{d.sep}}">
            <div style="width: 40px; height: 40px; border-radius: 11px; background: {{d.tint}}; color: {{d.ink}}; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; flex: 0 0 auto">{{d.kind}}</div>
            <div style="flex: 1; min-width: 0">
              <div style="font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{d.name}}</div>
              <div style="display: flex; gap: 6px; align-items: center; margin-top: 3px; font-size: 12px; color: #5E6675">
                <span style="display: flex; align-items: center; gap: 3px; font-weight: 700; color: {{d.visColor}}">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{d.visIcon}}"/></svg>{{d.vis}}</span>
                <span>· {{d.meta}}</span>
              </div>
            </div>
            <sc-if value="{{d.offline}}" hint-placeholder-val="{{ true }}">
              <span title="Disponible hors ligne" aria-label="Disponible hors ligne" style="width: 32px; height: 32px; border-radius: 16px; background: #E3EFE8; display: flex; align-items: center; justify-content: center; flex: 0 0 auto"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#22553F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></span>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 88px; background: #FFFFFF; border-top: 1px solid #EDE7DC; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 8px 10px 24px; box-sizing: border-box; gap: 4px">
    <a href="G-Dashboard.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #5E6675; font-size: 11px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</a>
    <a href="G-Planning.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #5E6675; font-size: 11px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Planning</a>
    <a href="G-Idees.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #5E6675; font-size: 11px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/></svg>Idées</a>
    <a href="G-Finances.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #5E6675; font-size: 11px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>Finances</a>
    <a href="G-Plus.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: #E3EFE8; border-radius: 16px; color: {{accent}}; font-size: 11px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>Plus</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F7A5D","options":["#2F7A5D","#1F6F8B","#B4532A","#5B4B8A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all' };
  }
  renderVals() {
    const LOCK = 'M6 11h12v9H6zM8 11V8a4 4 0 0 1 8 0v3';
    const PEOPLE = 'M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM3 20c.8-3 3-4.5 6-4.5s5.2 1.5 6 4.5M16 5a3 3 0 0 1 0 6M18 15c1.6.5 2.6 2 3 5';
    const T = {
      transport: { tint: '#C8E0EA', ink: '#1F5F7A' },
      hebergement: { tint: '#E4E6F7', ink: '#2F3680' },
      activite: { tint: '#E3EFE8', ink: '#22553F' },
      autre: { tint: '#F2EDE4', ink: '#3A4352' }
    };
    const all = [
      { group: 'Vendredi 17 oct.', cat: 'transport', kind: 'PDF', name: 'Carte d’embarquement Paris → Séville', priv: true, meta: 'Transport', offline: true },
      { group: '19 – 22 oct.', cat: 'hebergement', kind: 'PDF', name: 'Réservation Hôtel Casa Triana', priv: false, meta: 'Hébergement', offline: true },
      { group: 'Lundi 20 oct.', cat: 'activite', kind: 'PDF', name: 'Billets Alcázar.pdf', priv: false, meta: 'Lié à « Visite de l’Alcázar »', offline: true },
      { group: 'Sans date', cat: 'autre', kind: 'PDF', name: 'Assurance voyage', priv: true, meta: 'Autre', offline: true },
      { group: 'Sans date', cat: 'transport', kind: 'LIEN', name: 'Location de voiture · Sixt', priv: false, meta: 'Réf. SX-20391', offline: false }
    ];
    const f = this.state.filter;
    const filters = [['all', 'Tous'], ['transport', 'Transport'], ['hebergement', 'Hébergement'], ['activite', 'Activité'], ['autre', 'Autre']];
    const visible = all.filter((d) => f === 'all' || d.cat === f);
    const order = [];
    visible.forEach((d) => { if (order.indexOf(d.group) < 0) order.push(d.group); });
    return {
      accent: this.props.accent ?? '#2F7A5D',
      filters: filters.map(([k, label]) => ({
        label,
        bg: k === f ? '#1B2433' : '#EDE7DC',
        fg: k === f ? '#FFFFFF' : '#3A4352',
        pick: () => this.setState({ filter: k })
      })),
      groups: order.map((label) => ({
        label,
        docs: visible.filter((d) => d.group === label).map((d, i) => ({
          ...d, ...T[d.cat],
          sep: i === 0 ? 'none' : '1px solid #EEE8DD',
          vis: d.priv ? 'Privé' : 'Partagé',
          visIcon: d.priv ? LOCK : PEOPLE,
          visColor: d.priv ? '#8A3D12' : '#22553F'
        }))
      }))
    };
  }
}
</script>
</body>
</html>
