      <h1 style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.2">Coucher de soleil à la Plaza de España</h1>
      <div style="display: flex; align-items: center; gap: 8px; margin-top: 8px">

    <div style="display: flex; background: #EDE7DC; border-radius: 14px; padding: 4px">
      <sc-for list="{{states}}" as="s" hint-placeholder-count="3">
        <button onClick="{{s.pick}}" style="flex: 1; height: 38px; border: none; border-radius: 11px; font-family: inherit; font-size: 14px; font-weight: 600; background: {{s.bg}}; color: {{s.fg}}; {{s.shadow}}">{{s.label}}</button>
      </sc-for>
    </div>

    <div style="font-size: 15px; line-height: 1.55; color: #2C3443">La place est magique vers 18 h quand la lumière tape sur les azulejos. On peut louer une barque sur le canal (≈ 6 € les 35 min).</div>

    <div style="background: #FFFFFF; border-radius: 20px; display: flex; flex-direction: column">
      <div style="display: flex; gap: 12px; align-items: center; padding: 12px 14px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B2433" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>
        <div style="flex: 1; font-size: 15px; font-weight: 600">Balade</div>

        <div style="flex: 1; font-size: 15px; font-weight: 600">Plaza de España, Séville</div>
      </div>
      <div style="height: 1px; background: #EEE8DD; margin-left: 46px"></div>
      <a href="#" style="display: flex; gap: 12px; align-items: center; padding: 12px 14px">

      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 20V11M12 20V5M18 20v-6"/></svg>Sondage</button>
    <a href="G-IdeePlanifier.dc.html" style="flex: 1; height: 54px; border-radius: 16px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 700">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Ajouter au planning</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F7A5D","options":["#2F7A5D","#1F6F8B","#B4532A","#5B4B8A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { status: 0 };
  }
  renderVals() {
    const labels = ['Proposée', 'Retenue'];
    return {
      accent: this.props.accent ?? '#2F7A5D',
      states: labels.map((label, i) => ({
        label,
        bg: i === this.state.status ? '#FFFFFF' : 'transparent',
        fg: i === this.state.status ? '#1B2433' : '#5E6675',
        shadow: i === this.state.status ? 'box-shadow: 0 1px 3px rgba(27,36,51,0.12)' : '',
        pick: () => this.setState({ status: i })
      }))
    };
  }
}
</script>
</body>
