<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>7Trip — Nouvelle dépense</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F3EC; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1B2433">
  <div style="padding: 50px 14px 0; display: flex; align-items: center; justify-content: space-between">
    <a href="G-Finances.dc.html" aria-label="Annuler" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B2433" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <div style="font-size: 16px; font-weight: 700">Nouvelle dépense</div>
    <div style="width: 44px"></div>
  </div>

  <div style="padding: 6px 18px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
      <div style="font-size: 44px; font-weight: 800; letter-spacing: -0.03em">48,00 €</div>
      <input aria-label="Libellé" type="text" value="Tapas à Triana" style="width: 240px; height: 40px; border: none; border-bottom: 2px solid #E3DCCF; background: transparent; text-align: center; font-family: inherit; font-size: 16px; font-weight: 600; color: #1B2433; outline: none">
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 13px; font-weight: 700">Payé par</div>
      <div style="display: flex; gap: 8px">
        <span style="height: 36px; padding: 0 12px; border-radius: 999px; background: #1B2433; color: #FFFFFF; display: flex; align-items: center; font-size: 14px; font-weight: 600">Toi</span>
        <span style="height: 36px; padding: 0 12px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; font-size: 14px; font-weight: 600">Léa</span>
        <span style="height: 36px; padding: 0 12px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; font-size: 14px; font-weight: 600">Thomas</span>
        <span style="height: 36px; padding: 0 12px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; font-size: 14px; font-weight: 600">+3</span>
      </div>
    </div>

    <div style="display: flex; background: #EDE7DC; border-radius: 14px; padding: 4px">
      <sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
        <button onClick="{{m.pick}}" style="flex: 1; height: 40px; border: none; border-radius: 11px; font-family: inherit; font-size: 14px; font-weight: 700; background: {{m.bg}}; color: {{m.fg}}; {{m.shadow}}">{{m.label}}</button>
      </sc-for>
    </div>

    <sc-if value="{{shared}}" hint-placeholder-val="{{ true }}">
      <div style="background: #FFFFFF; border-radius: 20px; padding: 6px 0">
        <div style="display: flex; justify-content: space-between; padding: 6px 14px 4px"><span style="font-size: 13px; font-weight: 700">Pour qui ? <span style="font-weight: 500; color: #5E6675">· parts égales</span></span><span style="font-size: 13px; font-weight: 700; color: {{accent}}">Personnaliser</span></div>
        <sc-for list="{{people}}" as="p" hint-placeholder-count="6">
          <button onClick="{{p.toggle}}" aria-pressed="{{p.on}}" style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 8px 14px; border: none; background: transparent; font-family: inherit; color: #1B2433; text-align: left">
            <div style="width: 24px; height: 24px; border-radius: 7px; background: {{p.boxBg}}; border: {{p.boxBorder}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></div>
            <span style="flex: 1; font-size: 15px; font-weight: 600; color: {{p.nameColor}}">{{p.name}}</span>
            <span style="font-size: 14px; font-weight: 700; color: {{p.nameColor}}">{{p.share}}</span>
          </button>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{personal}}" hint-placeholder-val="{{ false }}">
      <div style="background: #FFFFFF; border-radius: 20px; padding: 14px; font-size: 14px; color: #3A4352; line-height: 1.5">Dépense personnelle : elle compte uniquement dans ton budget et n’entre pas dans les remboursements.</div>
    </sc-if>

    <button style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 14px; border: 1.5px dashed #C9C2B4; background: transparent; font-family: inherit; color: #3A4352">
      <span style="flex: 1; text-align: left; font-size: 14px; font-weight: 600">Catégorie, devise, lier au planning…</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E6675" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 34px; background: #F7F3EC; border-top: 1px solid #EDE7DC">
    <a href="G-Finances.dc.html" style="height: 54px; border-radius: 16px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">Ajouter la dépense</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F7A5D","options":["#2F7A5D","#1F6F8B","#B4532A","#5B4B8A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { shared: true, out: { Hugo: true } };
  }
  renderVals() {
    const accent = this.props.accent ?? '#2F7A5D';
    const names = ['Toi', 'Léa', 'Thomas', 'Camille', 'Hugo', 'Inès'];
    const inCount = names.filter((n) => !this.state.out[n]).length;
    const each = inCount ? (48 / inCount).toFixed(2).replace('.', ',') + ' €' : '—';
    const sel = (on) => ({ bg: on ? '#FFFFFF' : 'transparent', fg: on ? '#1B2433' : '#5E6675', shadow: on ? 'box-shadow: 0 1px 3px rgba(27,36,51,0.12)' : '' });
    return {
      accent,
      shared: this.state.shared,
      personal: !this.state.shared,
      modes: [
        { label: 'Personnelle', ...sel(!this.state.shared), pick: () => this.setState({ shared: false }) },
        { label: 'Partagée', ...sel(this.state.shared), pick: () => this.setState({ shared: true }) }
      ],
      people: names.map((name) => {
        const on = !this.state.out[name];
        return {
          name, on,
          share: on ? each : 'exclu',
          nameColor: on ? '#1B2433' : '#8C8A84',
          boxBg: on ? accent : '#FFFFFF',
          boxBorder: on ? 'none' : '2px solid #C9C2B4',
          toggle: () => this.setState({ out: { ...this.state.out, [name]: on } })
        };
      })
    };
  }
}
</script>
</body>
</html>
