<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>7Trip — Vote</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F3EC; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1B2433">
  <div style="padding: 50px 14px 0; display: flex; align-items: center; justify-content: space-between">
    <a href="G-Voyages.dc.html" aria-label="Retour" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B2433" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a>
    <div style="font-size: 14px; font-weight: 600; color: #5E6675">Vacances d’été entre potes</div>
    <a href="G-SondagePartage.dc.html" aria-label="Partager le sondage" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B2433" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg></a>
  </div>

  <div style="padding: 8px 18px 0; display: flex; flex-direction: column; gap: 14px">
    <div>
      <div style="display: flex; gap: 6px">
        <span style="font-size: 12px; font-weight: 700; color: #2F3680; background: #E4E6F7; border-radius: 999px; padding: 4px 10px">Plusieurs choix</span>
        <span style="font-size: 12px; font-weight: 600; color: #5E6675; background: #EDE7DC; border-radius: 999px; padding: 4px 10px">Clôture dim. 26 oct.</span>
      </div>
      <h1 style="margin: 10px 0 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Où part-on cet été ?</h1>
      <div style="font-size: 13px; color: #5E6675; margin-top: 4px">Proposé par Jordan</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{options}}" as="o" hint-placeholder-count="3">
        <button onClick="{{o.toggle}}" aria-pressed="{{o.on}}" style="display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 8px; border-radius: 18px; background: #FFFFFF; font-family: inherit; text-align: left; color: #1B2433; border: {{o.border}}; position: relative; overflow: hidden">
          <img src="{{o.photo}}" alt="" style="width: 64px; height: 64px; border-radius: 13px; object-fit: cover; flex: 0 0 auto">
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
            <div style="display: flex; justify-content: space-between; align-items: baseline">
              <span style="font-size: 16px; font-weight: 700">{{o.name}}</span>
              <span style="font-size: 13px; font-weight: 700; color: #5E6675">{{o.count}} votes</span>
            </div>
            <div style="height: 6px; border-radius: 3px; background: #EDE7DC; overflow: hidden"><div style="height: 6px; border-radius: 3px; background: {{o.bar}}; width: {{o.pct}}"></div></div>
            <div style="font-size: 12px; color: #5E6675">{{o.voters}}</div>
          </div>
          <div style="width: 26px; height: 26px; border-radius: 8px; flex: 0 0 auto; background: {{o.boxBg}}; border: {{o.boxBorder}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
          </div>
        </button>
      </sc-for>
    </div>

    <div style="background: #FFFFFF; border-radius: 18px; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
      <div style="display: flex">
        <div style="width: 28px; height: 28px; border-radius: 14px; background: #F3D2BC; border: 2px solid #FFFFFF; box-sizing: border-box; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center">LÉ</div>
        <div style="width: 28px; height: 28px; border-radius: 14px; background: #C9DCEF; border: 2px solid #FFFFFF; box-sizing: border-box; margin-left: -8px; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center">TH</div>
        <div style="width: 28px; height: 28px; border-radius: 14px; background: #D9E8DF; border: 2px solid #FFFFFF; box-sizing: border-box; margin-left: -8px; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center">CA</div>
        <div style="width: 28px; height: 28px; border-radius: 14px; background: #E4E6F7; border: 2px solid #FFFFFF; box-sizing: border-box; margin-left: -8px; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center">JO</div>
      </div>
      <div style="flex: 1"><div style="font-size: 14px; font-weight: 700">4 sur 7 ont voté</div><div style="font-size: 12px; color: #5E6675">En attente : Hugo, Inès, Max</div></div>
      <button style="height: 36px; padding: 0 12px; border-radius: 10px; border: none; background: #F2EDE4; font-family: inherit; font-size: 13px; font-weight: 700; color: #1B2433">Relancer</button>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 34px; background: #F7F3EC; border-top: 1px solid #EDE7DC; display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 12px; color: #5E6675; text-align: center">Tu peux changer ton vote tant que le sondage est ouvert.</div>
    <a href="G-SondageResultats.dc.html" style="height: 54px; border-radius: 16px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">Enregistrer mon vote</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F7A5D","options":["#2F7A5D","#1F6F8B","#B4532A","#5B4B8A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: { split: true, naxos: true, cefalu: false } };
  }
  renderVals() {
    const accent = this.props.accent ?? '#2F7A5D';
    const base = [
      { id: 'split', name: 'Split, Croatie', photo: '/_blob/f85d5fa5217dad85831aa2a31006ecbd', others: 3, voters: ['Léa', 'Thomas', 'Camille'] },
      { id: 'naxos', name: 'Naxos, Grèce', photo: '/_blob/35ec89a0f6456a03248bff66cb10b867', others: 2, voters: ['Léa', 'Camille'] },
      { id: 'cefalu', name: 'Cefalù, Sicile', photo: '/_blob/b5ff94f0058b068bee2b11547674a794', others: 1, voters: ['Thomas'] }
    ];
    return {
      accent,
      options: base.map((o) => {
        const on = !!this.state.picked[o.id];
        const count = o.others + (on ? 1 : 0);
        const names = on ? ['Toi'].concat(o.voters) : o.voters;
        return {
          ...o, on, count,
          pct: Math.round((count / 7) * 100) + '%',
          voters: names.join(', '),
          bar: on ? accent : '#B5AEA1',
          border: on ? '2px solid ' + accent : '2px solid transparent',
          boxBg: on ? accent : '#FFFFFF',
          boxBorder: on ? 'none' : '2px solid #C9C2B4',
          toggle: () => this.setState({ picked: { ...this.state.picked, [o.id]: !on } })
        };
      })
    };
  }
}
</script>
</body>
</html>
