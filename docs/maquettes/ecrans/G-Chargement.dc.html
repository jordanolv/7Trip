<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>7Trip — Chargement</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div aria-busy="true" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F3EC; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1B2433">
  <div style="padding: 52px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="font-size: 30px; font-weight: 800; font-style: italic; letter-spacing: -0.03em">7Trip</div>
      <div style="width: 44px; height: 44px; border-radius: 22px; background: #EDE7DC"></div>
    </div>
    <div style="display: flex; align-items: flex-end; justify-content: space-between">
      <div>
        <h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em">Vos voyages</h1>
        <div style="width: 220px; height: 14px; border-radius: 7px; background: #EDE7DC; margin-top: 10px"></div>
      </div>
      <div style="width: 52px; height: 52px; border-radius: 18px; background: #EDE7DC"></div>
    </div>
    <div style="display: flex; gap: 8px">
      <div style="width: 60px; height: 36px; border-radius: 18px; background: #EDE7DC"></div>
      <div style="width: 84px; height: 36px; border-radius: 18px; background: #EDE7DC"></div>
      <div style="width: 76px; height: 36px; border-radius: 18px; background: #EDE7DC"></div>
    </div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
      <div style="display: flex; height: 116px; background: #FFFFFF; border-radius: 20px; overflow: hidden; opacity: {{r.op}}">
        <div style="width: 120px; height: 116px; background: #EDE7DC"></div>
        <div style="flex: 1; padding: 16px 14px; display: flex; flex-direction: column; gap: 10px">
          <div style="width: 70%; height: 16px; border-radius: 8px; background: #EDE7DC"></div>
          <div style="width: 50%; height: 12px; border-radius: 6px; background: #F2EDE4"></div>
          <div style="width: 80px; height: 24px; border-radius: 12px; background: #F2EDE4; margin-top: auto"></div>
        </div>
      </div>
    </sc-for>
    <div role="status" style="font-size: 13px; color: #5E6675; text-align: center">Chargement de tes voyages…</div>
  </div>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 88px; background: #FFFFFF; border-top: 1px solid #EDE7DC; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 8px 16px 24px; box-sizing: border-box; gap: 8px">
    <a href="G-Voyages.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: #E3EFE8; border-radius: 16px; color: {{accent}}; font-size: 12px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>Voyages</a>
    <a href="G-Portfolio.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #5E6675; font-size: 12px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Portfolio</a>
    <a href="G-Profil.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #5E6675; font-size: 12px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profil</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F7A5D","options":["#2F7A5D","#1F6F8B","#B4532A","#5B4B8A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#2F7A5D',
      rows: [{ op: '1' }, { op: '0.8' }, { op: '0.6' }, { op: '0.4' }]
    };
  }
}
</script>
</body>
</html>
