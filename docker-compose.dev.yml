services:
  db:
    image: postgres:15
    container_name: postgres-7trip-dev
    ports:
      - '5451:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: 7trip_dev
    restart: always

  api:
    build:
      context: ./apps/api
      dockerfile: docker/Dockerfile.dev
    container_name: api-7trip-dev
    ports:
      - '4301:3001'
    env_file:
      - .env.dev
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    depends_on:
      - db
    restart: always

  front:
    build:
      context: ./apps/front
      dockerfile: docker/Dockerfile.dev
    container_name: front-7trip-dev
    ports:
      - '4300:3000'
    env_file:
      - .env.dev
    volumes:
      - ./apps/front:/app
      - /app/node_modules
    depends_on:
      - api
    restart: always
