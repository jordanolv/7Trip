services:
  db:
    image: postgres:15
    container_name: postgres-7trip-prod
    ports:
      - '5452:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: 7trip_prod
    restart: always

  api:
    build:
      context: ./apps/api
      dockerfile: docker/Dockerfile.prod
    container_name: api-7trip-prod
    ports:
      - '4401:3001'
    env_file:
      - .env.prod
    depends_on:
      - db
    restart: always

  front:
    build:
      context: ./apps/front
      dockerfile: docker/Dockerfile.prod
    container_name: front-7trip-prod
    ports:
      - '4400:3000'
    env_file:
      - .env.prod
    depends_on:
      - api
    restart: always
