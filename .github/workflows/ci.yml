name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: seventrip
          POSTGRES_PASSWORD: seventrip
          POSTGRES_DB: seventrip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seventrip"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://seventrip:seventrip@localhost:5432/seventrip?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: API e2e tests
        run: |
          pnpm --filter @7trip/api db:deploy
          pnpm test:e2e
