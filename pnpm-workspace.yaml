packages:
  - apps/*
  - packages/*

allowBuilds:
  '@prisma/engines': true
  prisma: true
  unrs-resolver: false
  esbuild: true

# Expo SDK 58 packages newer than the minimum release age (published by Expo, pinned).
minimumReleaseAgeExclude:
  - '@expo/cli@58.1.16'
  - '@expo/fingerprint@0.21.7'
  - '@expo/metro-config@58.0.18'
  - '@expo/router-server@58.0.18'
  - babel-preset-expo@58.0.21
  - expo-file-system@58.0.12
  - expo-modules-cli@0.3.3
  - expo-modules-core@58.0.27
  - expo-modules-jsi@58.0.20
  - expo@58.0.20
  - expo-router@58.0.27

# React Native / Metro resolve dependencies more reliably with a flat node_modules.
nodeLinker: hoisted
