packages:
  - apps/*
  - packages/*

allowBuilds:
  '@prisma/engines': true
  prisma: true
  unrs-resolver: false
  esbuild: true

# Expo SDK 58 packages newer than the minimum release age (published by Expo, pinned).
minimumReleaseAgeExclude:
  - '@expo/cli@58.1.16 || 58.1.22'
  - '@expo/fingerprint@0.21.7 || 0.22.0'
  - '@expo/metro-config@58.0.18 || 58.0.24'
  - '@expo/router-server@58.0.18 || 58.0.24'
  - babel-preset-expo@58.0.21 || 58.0.27
  - expo-file-system@58.0.12 || 58.0.15
  - expo-modules-cli@0.3.3
  - expo-modules-core@58.0.27 || 58.2.0
  - expo-modules-jsi@58.0.20 || 58.0.24
  - expo@58.0.20 || 58.0.25 || 58.1.0
  - expo-router@58.0.27 || 58.0.33
  - '@expo/config-plugins@58.0.14'
  - '@expo/config@58.0.13'
  - '@expo/inline-modules@0.2.11'
  - '@expo/local-build-cache-provider@58.0.13'
  - '@expo/metro-file-map@58.0.7'
  - '@expo/prebuild-config@58.0.21'
  - expo-glass-effect@58.0.6
  - expo-notifications@58.1.10
  - expo-sharing@58.0.24
  - expo-splash-screen@58.0.15

# React Native / Metro resolve dependencies more reliably with a flat node_modules.
nodeLinker: hoisted
